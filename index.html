<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoApp</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <h1 class="logo">ToDoApp</h1>

    <div class="header-buttons">
      <!-- Dark mode switch: CSS shows the moon in light mode and the sun in dark mode -->
      <button id="theme-btn" class="btn btn-light icon-btn" title="Dark mode" aria-label="Switch dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>

      <!-- Google login -->
      <button id="sign-in-btn" class="btn">Sign in with Google</button>
      <div id="user-box" class="user-box hide">
        <img id="user-photo" src="" alt="User photo" referrerpolicy="no-referrer">
        <span id="user-name"></span>
        <button id="sign-out-btn" class="btn btn-light">Logout</button>
      </div>
    </div>
  </header>

  <p id="signed-out" class="message hide">Sign in with Google to see your tasks.</p>

  <main class="container hide" id="app">

    <!-- SIDEBAR: the lists -->
    <aside class="sidebar">
      <h2>My Lists</h2>

      <!-- JS adds the lists here, like this:
        <li>
          <button class="active" data-id="LIST_ID">Work</button>
          <button class="list-edit" data-id="LIST_ID">✎</button>
          <button class="list-delete" data-id="LIST_ID">✕</button>
        </li>
      -->
      <ul id="lists" class="lists"></ul>

      <form id="list-form" class="list-form" novalidate>
        <input type="text" id="list-name" placeholder="New list" required>
        <button type="submit" class="btn">Add</button>
      </form>
      <p id="list-error" class="error"></p>
    </aside>

    <section class="content">

      <!-- Opens the form below -->
      <button type="button" id="new-task-btn" class="btn new-task-btn">+ New task</button>

      <!-- ADD / EDIT FORM (hidden until "+ New task" or "Edit") -->
      <form id="task-form" class="box hide" novalidate>
        <h2 id="form-title">Add a task</h2>

        <label for="task-title">Title</label>
        <input type="text" id="task-title" required>
        <p id="title-error" class="error"></p>

        <label for="task-details">Details</label>
        <textarea id="task-details" rows="2"></textarea>

        <div class="form-row">
          <div>
            <label for="task-list">List</label>
            <!-- JS adds the options: <option value="LIST_ID">Work</option> -->
            <select id="task-list" required></select>
            <p id="task-list-error" class="error"></p>
          </div>
          <div>
            <label for="task-due">Due date</label>
            <input type="date" id="task-due">
            <p id="due-error" class="error"></p>
          </div>
          <div>
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn">Add task</button>
        <button type="button" id="cancel-btn" class="btn btn-light">Cancel</button>
      </form>

      <!-- SEARCH, FILTERS, SORT -->
      <div class="toolbar">
        <div>
          <label for="search">Search</label>
          <input type="text" id="search" placeholder="Search tasks">
        </div>
        <div>
          <label for="filter-priority">Priority</label>
          <select id="filter-priority">
            <option value="all">All</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div>
          <label for="filter-date">Due date</label>
          <select id="filter-date">
            <option value="all">All</option>
            <option value="today">Today</option>
            <option value="overdue">Overdue</option>
            <option value="upcoming">Upcoming</option>
            <option value="none">No date</option>
          </select>
        </div>
        <div>
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="newest">Newest</option>
            <option value="due">Due date</option>
            <option value="priority">Priority</option>
          </select>
        </div>
      </div>

      <!-- TASKS / TRASH + PROGRESS -->
      <div class="view-bar">
        <div class="tabs">
          <button class="tab active" data-view="tasks">Tasks</button>
          <button class="tab" data-view="trash">Trash</button>
        </div>

        <div class="progress">
          <span id="progress-text">0 of 0 done</span>
          <div class="progress-bar">
            <div id="progress-fill"></div>
          </div>
        </div>
      </div>

      <!-- For "No tasks found" and "Trash is empty" -->
      <p id="message" class="message"></p>

      <!-- JS adds the cards here, like this:
        <article class="task high" data-id="TASK_ID">
          <input type="checkbox" class="task-check">
          <div class="task-body">
            <h3>Buy a birthday gift</h3>
            <p>For Sami, before Friday</p>
            <div class="task-info">
              <span class="priority">High</span>
              <span class="due">Due tomorrow</span>
              <span>Personal</span>
            </div>
          </div>
          <div class="task-buttons">
            <button class="edit-btn">Edit</button>
            <button class="delete-btn">Delete</button>
          </div>
        </article>
      -->
      <div id="tasks" class="tasks"></div>

    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>&copy; 2026 Abd-alrhman Fayyad | <a href="https://github.com/abd-alrhmanfayyad/ToDoApp">GitHub</a></p>
  </footer>

</body>

</html>
